name: .NET CI

on:
  push:
    branches:
      - master
      - ui/modernize-layout-and-global-styles
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Restore and build ASP.NET Core app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK information
        run: dotnet --info

      - name: Restore web project and dependencies
        run: dotnet restore MWSManager/MWSManager.csproj

      - name: Build web project
        run: dotnet build MWSManager/MWSManager.csproj --configuration Release --no-restore
