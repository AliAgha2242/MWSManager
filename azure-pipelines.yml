            -ArgumentList "$(remoteDeployPath)", "$(composeFile)" `
            -ScriptBlock {
              param($path, $file)

              $ErrorActionPreference = 'Stop'

              Set-Location -LiteralPath $path

              Write-Host "Starting Docker Compose deployment..."
              Write-Host "Directory: $path"
              Write-Host "Compose file: $file"

              # Redirect Docker output to files on the remote server.
              # This avoids PowerShell remoting misclassifying native stderr
              # output as a terminating NativeCommandError on the build agent.
              $stdout = Join-Path $path 'docker-deploy-out.log'
              $stderr = Join-Path $path 'docker-deploy-err.log'

              docker compose -f $file up -d --build 1> $stdout 2> $stderr
              $exitCode = $LASTEXITCODE

              Write-Host "----- Docker Compose standard output -----"
              if (Test-Path -LiteralPath $stdout) {
                Get-Content -LiteralPath $stdout
              }

              Write-Host "----- Docker Compose standard error -----"
              if (Test-Path -LiteralPath $stderr) {
                Get-Content -LiteralPath $stderr
              }

              if ($exitCode -ne 0) {
                throw "Docker Compose deployment failed. Exit code: $exitCode. See $stdout and $stderr on the remote server."
              }

              Write-Host "Docker Compose deployment completed successfully."
            }
        }
        finally {
          if ($null -ne $session) {
            Remove-PSSession $session
          }
        }
    env:
      RABBIT_SRV_USERNAME: $(RabbitSrvUsername)
      RABBIT_SRV_PASSWORD: $(RabbitSrvPassword)

  # ----------------------------------------------------------

  # Step 7: Verify deployment status
  # ----------------------------------------------------------
  - task: PowerShell@2
    displayName: '6 - Verify Deployment'
    condition: and(succeeded(), contains(variables['Build.SourceVersionMessage'], 'deploy'))
    inputs:
      targetType: inline
      script: |
        $ErrorActionPreference = 'Stop'

        $securePassword = ConvertTo-SecureString `
          $env:RABBIT_SRV_PASSWORD -AsPlainText -Force

        $credential = [System.Management.Automation.PSCredential]::new(
          $env:RABBIT_SRV_USERNAME,
          $securePassword
        )

        $session = $null

        try {
          $session = New-PSSession `
            -ComputerName "$(remoteComputer)" `
            -Credential $credential

          Invoke-Command `
            -Session $session `
            -ArgumentList "$(remoteDeployPath)", "$(composeFile)" `
            -ScriptBlock {
              param($path, $file)

              $ErrorActionPreference = 'Stop'

              Set-Location -LiteralPath $path

              Write-Host "Checking Compose service status..."

              docker compose -f $file ps

              if ($LASTEXITCODE -ne 0) {
                throw "Failed to retrieve Docker Compose service status."
              }

              Write-Host "Deployment verification completed."
            }
        }
        finally {
          if ($null -ne $session) {
            Remove-PSSession $session
          }
        }
    env:
      RABBIT_SRV_USERNAME: $(RabbitSrvUsername)
      RABBIT_SRV_PASSWORD: $(RabbitSrvPassword)

